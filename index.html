<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="static/favicon.ico" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Mapbox -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Mapbox Geocoder (remove if unused in viewer.js) -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" rel="stylesheet"/>

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

  <!-- Color Picker -->
  <script src="static/colorjoe.min.js"></script>
  <link rel="stylesheet" href="static/colorjoe.css"/>

  <link rel="stylesheet" href="styles.css" />
  <title>BIM model viewer with GIS</title>
</head>

<body class="overflow-hidden">

<!-- Viewer -->
<div id="viewer-container" class="relative w-screen h-screen"></div>

<!-- Loading Overlay -->
<div id="progress-container"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-neutral-500/80">
  <div class="p-4 rounded-xl shadow-xl bg-white flex flex-col items-center gap-2 text-sm">
    <div class="flex gap-2">
      <p id="progress-label"></p>
      <p id="progress-text"></p>
    </div>
    <img src="static/spinner.svg" class="w-10 h-10" alt="Loading IFC.js"/>
  </div>
</div>

<!-- Hamburger Menu -->
<div class="absolute top-2 left-2 z-30">

  <!-- Toggle Button -->
  <button id="hamburger-toggle"
          aria-label="Open menu"
          class="p-2 bg-white/80 backdrop-blur-md rounded-xl shadow-xl">
    <span class="material-icons text-3xl">menu</span>
  </button>

  <!-- Panel -->
  <div id="hamburger-panel"
       class="hidden mt-2 p-2 flex flex-col gap-1 bg-white/80 backdrop-blur-md rounded-xl shadow-xl">

    <button id="sample-button" class="sample-btn flex gap-2 items-center">
      <span class="material-icons">home</span> Open sample model
    </button>

    <input type="file" id="file-input" class="hidden"/>

    <button id="save-button" class="sample-btn flex gap-2 items-center">
      <span class="material-icons">upload_file</span> Upload model
    </button>

    <button id="remove-button" class="sample-btn flex gap-2 items-center">
      <span class="material-icons">delete</span> Remove cached model
    </button>

  </div>
</div>

<!-- Right Panels -->
<div class="absolute absolute bottom-16 right-2 z-30 flex flex-col gap-2 items-end">
  <div id="palette-container"
       class="hidden p-2 bg-white/30 rounded-xl shadow-xl">
    <div class="colorjoe"></div>
  </div>

  <div id="properties-container"
       class="hidden p-2 bg-white/30 rounded-xl shadow-xl max-w-[50vh] max-h-[50vh] overflow-y-auto">
  </div>
</div>

<div class="fixed right-2 bottom-2 z-30 flex flex-row items-end gap-4">

  <!-- Dimension Button -->
  <button id="dim-button"
          class="p-4 bg-white text-black rounded-full shadow-xl">
    <span class="material-icons">straighten</span>
  </button>

  <!-- Palette Button -->
  <button id="palette-button"
          class="p-4 bg-white text-black rounded-full shadow-xl">
    <span class="material-icons">palette</span>
  </button>

  <!-- Help Button Wrapper -->
  <div class="relative">
    <button id="guide-button"
            class="p-4 bg-white text-black rounded-full shadow-xl">
      <span class="material-icons">help</span>
    </button>

    <!-- Guide Card (now positioned relative to the Help button) -->
    <div id="guide-container"
         class="hidden absolute bottom-16 right-0 z-40 p-4 bg-white/30 rounded-xl shadow-2xl w-[300px]">

      <table id="guide-table" class="table-fixed text-sm mt-8">
        <tbody>
          <tr><td class="font-semibold">Add clipping:</td><td>Click element + P</td></tr>
          <tr><td class="font-semibold">Remove clipping:</td><td>Select arrow + O</td></tr>
          <tr>
            <td class="font-semibold">Measure:</td>
            <td>Press Dimension → Double-click start → Click end</td>
          </tr>
          <tr><td class="font-semibold">Delete measure:</td><td>Select label + Del</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Footer -->
<footer class="fixed bottom-0 w-full flex justify-center z-20 pointer-events-none">
  <div class="px-2 bg-neutral-200/70 text-xs">
    Built with
    <a href="https://ifcjs.github.io/info" target="_blank"
       class="pointer-events-auto underline font-bold">IFC.js</a>
    by vinay © 2025
  </div>
</footer>

<!-- Scripts -->
<script src="bundle/viewer.js"></script>
<script src="static/ui-events.js" defer></script>


</body>
</html>
